<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

<body>
    <!--Website Header-->
    <header class="header">
        <div class="top-bar">
        <div class="spacer"></div>

        <a href="#" class="logo">
            <img src="Logo.png" alt="Logo">
        </a>
        <div class="icons">
            <a href="sl-account.html" class="account-icon">
                <div class="fas fa-user" id="login-btn"></div>
            </a>
            <a href="sl-cart.html" class="cart-icon">
                <div class="fas fa-shopping-cart" id="cart-btn"></div>
            </a>
            <div class="fas fa-search" id="search-btn"></div>
        </div>
    </header>

    <!--Navigation Bar-->
    <nav class="navbar">
        <a href="sl-home.html">Home</a>
        <a href="sl-jewelries.html">Jewelries</a>
        <a href="sl-contact.html">Contact</a>
        <a href="sl-faq.html">FAQ</a>
    
        <!-- Search Form -->    
        <form id="search-form" class="search-form" style="display: none;">
            <input type="text" id="search-input" placeholder="Search Product.."/>
            <button type="submit">Search</button>
            <button type="button" id="search-cancel">&times;</button>
        </form>
    </nav>
    
        <!-- Search Form -->    
        <form id="search-form" class="search-form" style="display: none;">
            <input type="text" id="search-input" placeholder="Search Product.."/>
            <button type="submit">Search</button>
            <button type="button" id="search-cancel">&times;</button>
        </form>
    </nav>

    <!-- Shopping Cart Section -->
    <main class="cart-container">
        <section class="cart-items">
            <a href="sl-jewelries.html" class="back-link"><i class="fas fa-arrow-left"></i>Continue Shopping</a>
            <h1>Your Cart</h1>
            <div id="cart-items-list" class="cart-items-list">
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <p>Cart is currently empty.</p>
                </div>
            </div>
        </section>

        <!-- Order Summary -->
        <aside class="order-total">
            <h2>Order Total</h2>
            <hr>
            <div class="summary-total">
                <span>Total</span>
                <span id="total-price">0 BND</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-contact">
            <div class="contact-items">
                <p><i class="fas fa-map-marker-alt"></i>RPN Kampung Lumut, Kuala Belait</p>
                <p><i class="fas fa-envelope"></i>
                    <a href=mailto:"softlylabel@gmail.com">softlylabel@gmail.com</a></p>
                <p><i class="fa-brands fa-instagram"></i>
                    <a href="https://www.instagram.com/SoftlyLabel/" target="_blank">@softlylabel</a>
                </p>
            </div>
        </div>

        <div class="footer-bottom">
